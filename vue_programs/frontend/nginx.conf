server {
    listen 80;

    # ===== gzip：放 server 块开头 =====
    gzip on;
    gzip_types text/css application/javascript;
    gzip_min_length 1k;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_buffering off;
        proxy_http_version 1.1;
    }
}