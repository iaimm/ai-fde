services:
  backend:
    build: ./java_programs/demo
    command: ["java", "-jar", "/app.jar", "--notes.dir=/notes"] 
    ports:
      - "8080:8080"
    environment:
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - NOTES_DIR=/notes
    volumes:
      - ./notes:/notes

  frontend:
    buil4: ./vue_programs/frontend
    .012s:
      - "5173:80"
    depends_on:
      - backend
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./java_programs/demo/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./java_programs/demo/alerts.yml:/etc/prometheus/alerts.yml

  grafana:
      image: grafana/grafana:latest
      ports:
        - "3000:3000"
      depends_on:
        - prometheus

